<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLead AI Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">AutoLead AI</h1>
            <p class="text-gray-500 mt-2">AI-Driven Lead Workflow Prototype</p>
        </div>

        <form id="leadForm" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="company_name" class="block text-sm font-medium text-gray-700">Company Name</label>
                <input type="text" id="company_name" name="company_name" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="company_url" class="block text-sm font-medium text-gray-700">Company Website</label>
                <input type="url" id="company_url" name="company_url" placeholder="https://example.com" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                Submit Lead & Generate Audit
            </button>
        </form>

        <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-sm text-center"></div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            // Get form data
            const sessionId = Math.random().toString(36).substring(2, 15);
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                company_name: document.getElementById('company_name').value,
                company_url: document.getElementById('company_url').value,
                session_id: sessionId
            };

            // Update UI
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Connecting...
            `;
            statusMessage.classList.remove('hidden');
            statusMessage.className = 'mt-6 p-4 rounded-lg text-sm text-center bg-blue-50 text-blue-800';
            statusMessage.textContent = 'Initializing workflow...';

            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/status/${sessionId}`);
            
            ws.onmessage = (event) => {
                statusMessage.textContent = event.data;
                if (event.data.includes('Completed successfully') || event.data.includes('Error')) {
                    ws.close();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Lead & Generate Audit';
                    if (event.data.includes('Completed')) {
                        statusMessage.className = 'mt-6 p-4 rounded-lg text-sm text-center bg-green-50 text-green-800';
                        document.getElementById('leadForm').reset();
                    } else {
                        statusMessage.className = 'mt-6 p-4 rounded-lg text-sm text-center bg-red-50 text-red-800';
                    }
                }
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (!response.ok) {
                    statusMessage.className = 'mt-6 p-4 rounded-lg text-sm text-center bg-red-50 text-red-800';
                    statusMessage.textContent = 'Error: ' + (result.detail?.[0]?.msg || JSON.stringify(result.detail) || 'Submission failed');
                    ws.close();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Lead & Generate Audit';
                }
            } catch (error) {
                statusMessage.className = 'mt-6 p-4 rounded-lg text-sm text-center bg-red-50 text-red-800';
                statusMessage.textContent = 'Network error occurred. Please try again.';
                ws.close();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Lead & Generate Audit';
            }
        });
    </script>
</body>
</html>
